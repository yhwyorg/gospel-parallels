name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tests run before publishing: they check that every verse of all four
      # Gospels belongs to a section and that every reference is real, so a bad
      # data edit stops here instead of shipping an empty column.
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # The downloadable books are printed from the built site by headless Chromium.
      # Noto supplies the Chinese, Korean and Arabic fonts the stylesheet names;
      # without them the PDFs would print those scripts as empty boxes, and
      # scripts/build-books.mjs fails the deploy if any text is drawn in a font the
      # stylesheet does not name.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk
      - run: npx playwright install --with-deps chromium
      - run: npm run books
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
